# Used for the "test" Spring profile (Day 10: Testcontainers integration
# tests). No datasource block here on purpose - AbstractIntegrationTest's
# @ServiceConnection annotation on the PostgreSQLContainer injects the
# container's JDBC URL/credentials automatically, so hardcoding placeholder
# values here would just be dead config that nothing reads.
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
